name: jarvis

# Logs begrenzen (SD-Karte schonen)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Für die Node-Dienste: kein Root, keine Zusatzrechte
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: false

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *logging
    mem_limit: 900m
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: jarvis
      MCP_RO_PASSWORD: ${MCP_RO_PASSWORD:-}
      TZ: Europe/Berlin
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Auf 4 GB RAM und SD-Karte abgestimmt: wenig Schreibzugriffe, überschaubarer Speicher.
    # synchronous_commit=off: bei hartem Stromausfall gehen max. ~0,5 s Nachrichten verloren, dafür deutlich weniger SD-Verschleiß.
    command: >
      postgres
      -c shared_buffers=192MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=96MB
      -c max_connections=30
      -c synchronous_commit=off
      -c wal_compression=on
      -c checkpoint_timeout=15min
      -c max_wal_size=1GB
      -c log_min_duration_statement=2000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [internal]

  # Lokale Transkription (nur Fallback ohne OPENAI_API_KEY; auf einem Pi 4 sehr langsam). Start mit COMPOSE_PROFILES=local-whisper
  whisper:
    profiles: ["local-whisper"]
    build:
      context: ./whisper
      args:
        MODEL: ${WHISPER_MODEL:-small}
    restart: unless-stopped
    logging: *logging
    mem_limit: 1500m
    cpus: 1.5   # Pi 4 ohne Lüfter wird bei Volllast >80 °C heiß und drosselt; lieber langsamer und kühl
    networks: [internal]

  # Berechnet Embeddings (multilingual-e5-small) für die Bedeutungssuche; füllt fehlende Vektoren im Hintergrund auf
  embedder:
    build: ./embedder
    restart: unless-stopped
    logging: *logging
    <<: *hardened
    mem_limit: 800m
    cpus: 1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jarvis:${POSTGRES_PASSWORD:-}@postgres:5432/jarvis
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      EMBED_BATCH: ${EMBED_BATCH:-}
      ORGANIZER_EXCLUDE_NAMES: ${ORGANIZER_EXCLUDE_NAMES:-}
      ORGANIZER_REDACT: ${ORGANIZER_REDACT:-true}
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 20s   # bei lokaler Berechnung auf einem Kern antwortet er unter Last langsam
      retries: 6
      start_period: 60s
    networks: [internal]

  wa-ingest:
    build: ./wa-ingest
    restart: unless-stopped
    logging: *logging
    <<: *hardened
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jarvis:${POSTGRES_PASSWORD:-}@postgres:5432/jarvis
      WHISPER_URL: http://whisper:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TRANSCRIBE_PROVIDER: ${TRANSCRIBE_PROVIDER:-}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      IMAGE_DESCRIBE: ${IMAGE_DESCRIBE:-true}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-4.1-mini}
      IMAGE_DETAIL: ${IMAGE_DETAIL:-auto}
      IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-3}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BAILEYS_LOG_LEVEL: ${BAILEYS_LOG_LEVEL:-warn}
      WHISPER_LANG: ${WHISPER_LANG:-de}
      TRANSCRIBE_MAX_AGE_DAYS: ${TRANSCRIBE_MAX_AGE_DAYS:-}
      AUTH_DIR: /data/auth
      WA_PAIRING_PHONE: ${WA_PAIRING_PHONE:-}
      TZ: Europe/Berlin
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - wa-auth:/data/auth
      # Verknüpfungsstatus (QR/Kopplungscode) für die Admin-Oberfläche
      - wa-status:/data/status
      # Dateien, die Claude per send_media(file=...) verschicken darf
      - ./outgoing:/outgoing:ro
    networks: [internal]

  mcp-server:
    # Built from the repository root so the shared contract (packages/contract) is in the build context;
    # mcp-server/Dockerfile.dockerignore keeps everything else out.
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    restart: unless-stopped
    logging: *logging
    <<: *hardened
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    # Nur auf dem Pi selbst erreichbar (Loopback), nicht im Heimnetz. Der Cloudflare-Tunnel des Pi greift hier zu: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      OWNER_NAME: ${OWNER_NAME:-}
      DATABASE_URL: postgres://mcp_ro:${MCP_RO_PASSWORD:-}@postgres:5432/jarvis
      # nur INSERT/SELECT auf die outbox (gleiches Passwort wie mcp_ro, siehe db/init/002_roles.sh)
      ACTIONS_DATABASE_URL: postgres://mcp_act:${MCP_RO_PASSWORD:-}@postgres:5432/jarvis
      EMBED_URL: http://embedder:3001
      # Gedächtnis und manuelle Korrekturen (Rolle mcp_mem, siehe db/init/007_mem_role.sh)
      MEM_DATABASE_URL: postgres://mcp_mem:${MCP_RO_PASSWORD:-}@postgres:5432/jarvis
      ENABLE_MEMORY: ${ENABLE_MEMORY:-true}
      ENABLE_ACTIONS: ${ENABLE_ACTIONS:-true}
      MAX_ACTIONS_PER_HOUR: ${MAX_ACTIONS_PER_HOUR:-30}
      # false = Aktionen laufen sofort (keine Vorschau-Stufe); true = erst Vorschau, dann confirm=true
      REQUIRE_CONFIRM: ${REQUIRE_CONFIRM:-false}
      SEARCH_MAX_TOPIC_DIST: ${SEARCH_MAX_TOPIC_DIST:-0.52}
      MCP_TOKEN: ${MCP_TOKEN:-}
      # true = the static MCP_TOKEN keeps working next to OAuth (old connector URLs /t/<token>/mcp)
      MCP_LEGACY_TOKEN: ${MCP_LEGACY_TOKEN:-true}
      # Public address of the API through the Cloudflare tunnel: OAuth issuer, pairing QR code
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # Shared secret for the internal admin API on :3001 (docker network only, not published)
      ADMIN_INTERNAL_SECRET: ${ADMIN_INTERNAL_SECRET:-}
      INTERNAL_PORT: "3001"
      # Reply suggestions and "Ask Jarvis" in the app
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      APP_MODEL: ${APP_MODEL:-gpt-4.1-mini}
      PORT: "3000"
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

  # Sortiert Nachrichten per OpenAI-API zu Themen (Threads), Zusammenfassungen und Vorschlägen.
  # Nur aktiv mit COMPOSE_PROFILES=organizer (und ORGANIZER_ENABLED=true + OPENAI_API_KEY in .env). Schätzung vorab:
  #   docker compose --profile organizer run --rm organizer node dist/index.js --estimate
  organizer:
    profiles: ["organizer"]
    build: ./organizer
    restart: unless-stopped
    logging: *logging
    <<: *hardened
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jarvis:${POSTGRES_PASSWORD:-}@postgres:5432/jarvis
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ORGANIZER_ENABLED: ${ORGANIZER_ENABLED:-false}
      ORGANIZER_MODEL: ${ORGANIZER_MODEL:-gpt-4.1-mini}
      ORGANIZER_REASONING_EFFORT: ${ORGANIZER_REASONING_EFFORT:-}
      ORGANIZER_PRICE_IN: ${ORGANIZER_PRICE_IN:-0.4}
      ORGANIZER_PRICE_OUT: ${ORGANIZER_PRICE_OUT:-1.6}
      ORGANIZER_DAILY_TOKEN_BUDGET: ${ORGANIZER_DAILY_TOKEN_BUDGET:-3000000}
      ORGANIZER_SETTLE_HOURS: ${ORGANIZER_SETTLE_HOURS:-1}
      ORGANIZER_MIN_MESSAGES: ${ORGANIZER_MIN_MESSAGES:-4}
      ORGANIZER_MAX_WAIT_HOURS: ${ORGANIZER_MAX_WAIT_HOURS:-12}
      ORGANIZER_IDLE_MINUTES: ${ORGANIZER_IDLE_MINUTES:-2}
      ORGANIZER_MAX_MESSAGES: ${ORGANIZER_MAX_MESSAGES:-150}
      ORGANIZER_MAX_CHARS: ${ORGANIZER_MAX_CHARS:-30000}
      TOPIC_STALE_DAYS: ${TOPIC_STALE_DAYS:-21}
      TOPIC_PAST_GRACE_HOURS: ${TOPIC_PAST_GRACE_HOURS:-24}
      # Personen-Profile: Neubewertung nur bei Veränderung (Wachstum, Gruppen, Aktivität), höchstens alle 14 Tage
      PEOPLE_MIN_MESSAGES: ${PEOPLE_MIN_MESSAGES:-30}
      PEOPLE_MIN_THEIRS: ${PEOPLE_MIN_THEIRS:-8}
      PEOPLE_MIN_INTERVAL_DAYS: ${PEOPLE_MIN_INTERVAL_DAYS:-14}
      PEOPLE_REFRESH_GROWTH: ${PEOPLE_REFRESH_GROWTH:-1.2}
      PEOPLE_GROUP_DELTA: ${PEOPLE_GROUP_DELTA:-3}
      PEOPLE_ACTIVITY_DELTA: ${PEOPLE_ACTIVITY_DELTA:-15}
      PEOPLE_MAX_PER_DAY: ${PEOPLE_MAX_PER_DAY:-60}
      PEOPLE_SCRUB: ${PEOPLE_SCRUB:-false}
      OWNER_NAME: ${OWNER_NAME:-}
      OWN_NAMES: ${OWN_NAMES:-}
      ORGANIZER_EXCLUDE_NAMES: ${ORGANIZER_EXCLUDE_NAMES:-}
      ORGANIZER_REDACT: ${ORGANIZER_REDACT:-true}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      TZ: Europe/Berlin
    networks: [internal]

  # Nur aktiv, wenn COMPOSE_PROFILES=tunnel in .env steht (Token vorher eintragen)
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - mcp-server
    networks: [internal]

  # Weboberfläche für Einrichtung und Einstellungen. Start: docker compose up -d admin, dann http://<adresse-des-pi>:8080
  # Steuert Docker über den Socket (entspricht Root auf dem Pi): nur im Heimnetz, nie über den Tunnel veröffentlichen.
  admin:
    # Built from the repository root: the image contains the Expo web app (app/) as its interface.
    # admin/Dockerfile.dockerignore keeps everything else out.
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    logging: *logging
    mem_limit: 192m
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:${ADMIN_PORT:-8080}:8080"
    environment:
      ADMIN_PUBLIC_PORT: ${ADMIN_PORT:-8080}
      # App API and OAuth (proxied for the web app) and mcp-server's internal admin API
      APP_API_URL: http://mcp-server:3000
      APP_INTERNAL_URL: http://mcp-server:3001
      TZ: Europe/Berlin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project
      # Tresor-Modus: Ordner, auf den .env verweist (sonst noch einmal das Projekt)
      - ${JARVIS_SECRETS_DIR:-.}:/secrets
      - admin-data:/data
      - wa-status:/wa-status:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

volumes:
  pgdata:
  wa-auth:
  wa-status:
  admin-data:

networks:
  internal:
