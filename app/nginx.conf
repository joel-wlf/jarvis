# The tunnel uses the Docker-only :8084 listener. Client-supplied forwarded
# headers on the LAN listener are ignored.
map $server_port $jarvis_client {
  8084 $http_cf_connecting_ip;
  default $remote_addr;
}
map $server_port $jarvis_scheme {
  8084 https;
  default $scheme;
}
server {
  listen 8080;
  listen 8084;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $admin http://admin:8080;
  set $mcp http://mcp-server:3000;

  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $jarvis_client;
  proxy_set_header X-Forwarded-Proto $jarvis_scheme;
  proxy_set_header CF-Connecting-IP "";
  proxy_set_header CF-Ray "";
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 300s;

  location = /healthz { access_log off; return 200 "ok\n"; }
  location /api/v1/ { proxy_pass $mcp$request_uri; }
  location /api/ { proxy_pass $admin$request_uri; }
  location /oauth/ { proxy_pass $mcp$request_uri; }
  location /register { proxy_pass $mcp$request_uri; }
  location /token { proxy_pass $mcp$request_uri; }
  location /authorize { proxy_pass $mcp$request_uri; }
  location /revoke { proxy_pass $mcp$request_uri; }
  location /.well-known/ { proxy_pass $mcp$request_uri; }
  location = /mcp { proxy_pass $mcp$request_uri; }
  location /t/ { proxy_pass $mcp$request_uri; }
  location / { try_files $uri $uri/ /index.html; }
}
