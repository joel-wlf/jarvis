name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [mcp-server, wa-ingest, organizer, embedder, admin]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - if: matrix.service == 'admin' || matrix.service == 'mcp-server' || matrix.service == 'organizer'
        run: npm test
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: cp .env.example .env && docker compose config -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run export:web
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - name: Start web setup without database or credentials
        run: |
          docker compose up -d --build admin app-web
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8081/api/state > /tmp/state.json; then break; fi
            sleep 2
          done
          python3 -c 'import json; s=json.load(open("/tmp/state.json")); assert not s["configured"] and not s["initialized"] and not s["setupComplete"]'
          curl -fsS http://localhost:8081/setup > /dev/null
          test -z "$(docker compose ps --status running --services | grep -E '^(postgres|mcp-server)$' || true)"
      - if: always()
        run: docker compose logs --tail 100 app-web
      - if: always()
        run: docker compose down
