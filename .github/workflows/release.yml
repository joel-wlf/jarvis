# Attaches the installer and the compose bundle to a GitHub release when a v* tag is pushed.
# The images for the same tag are built by images.yml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the compose bundle
        run: |
          mkdir -p dist
          tar -czf dist/jarvis-compose.tar.gz docker-compose.yml .env.example db/init
          cp install.sh dist/install.sh
          (cd dist && sha256sum install.sh jarvis-compose.tar.gz > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
