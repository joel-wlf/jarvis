# Prebuilt multi-arch images on GitHub Container Registry, so nobody has to build on a Raspberry Pi.
# Image names follow the repository: ghcr.io/<owner>/<repo>-<service>, lowercased. A repo rename needs no edits here;
# only the default JARVIS_REGISTRY (admin/src/schema.ts, docker-compose.yml) has to follow.
name: Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  image:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built from the repository root (shared packages/ and app/); <service>/Dockerfile.dockerignore filters the context
          - { service: admin, context: ., file: admin/Dockerfile }
          - { service: app-web, context: ., file: app/Dockerfile.web }
          - { service: mcp-server, context: ., file: mcp-server/Dockerfile }
          - { service: wa-ingest, context: wa-ingest, file: wa-ingest/Dockerfile }
          - { service: embedder, context: embedder, file: embedder/Dockerfile }
          - { service: organizer, context: organizer, file: organizer/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=jarvis-${{ matrix.service }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
